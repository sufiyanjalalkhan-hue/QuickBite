<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration | QuickBite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="form-page">

<header class="navbar">
    <a href="index.html" class="logo">🍔 QuickBite</a>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<div class="form-container">
    <div class="form-icon">🍽️</div>
    <h2>Create Account</h2>
    <p class="subtitle">Join QuickBite and explore delicious food</p>

    <form id="registerForm">
        <label>Full Name</label>
        <input type="text" id="registerName"
               placeholder="Enter your full name" required>

        <label>Email Address</label>
        <input type="email" id="registerEmail"
               placeholder="Enter your email" required>

        <label>Mobile Number</label>
        <input type="tel" id="registerPhone"
               placeholder="10-digit mobile number"
               pattern="[0-9]{10}" maxlength="10" required>

        <label>Password</label>
        <input type="password" id="registerPassword"
               placeholder="Create a password"
               minlength="6" required>

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword"
               placeholder="Re-enter your password"
               minlength="6" required>

        <button type="submit" class="btn full-btn">Create Account</button>
        <p id="registerMessage" class="message"></p>
    </form>

    <p class="form-bottom">
        Already registered? <a href="login.html">Login</a>
    </p>
    <p class="form-bottom"><a href="index.html">← Back to Home</a></p>
</div>

<script src="script.js"></script>
</body>
</html>
