<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | QuickBite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="form-page">

<header class="navbar">
    <a href="index.html" class="logo">🍔 QuickBite</a>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<div class="form-container">
    <div class="form-icon">🔐</div>
    <h2>Reset Password</h2>
    <p class="subtitle">Recover access to your account</p>

    <form id="forgotForm">
        <label>Registered Email</label>
        <input type="email" id="resetEmail"
               placeholder="Enter your registered email" required>

        <button type="submit" class="btn full-btn">
            Generate Demo OTP
        </button>
    </form>

    <div id="resetSection" hidden>
        <form id="resetForm">
            <label>Demo OTP</label>
            <input type="text" id="resetOtp"
                   placeholder="Enter the demo OTP"
                   inputmode="numeric" required>

            <label>New Password</label>
            <input type="password" id="newPassword"
                   placeholder="Enter new password"
                   minlength="6" required>

            <label>Confirm New Password</label>
            <input type="password" id="confirmNewPassword"
                   placeholder="Confirm new password"
                   minlength="6" required>

            <button type="submit" class="btn full-btn">
                Reset Password
            </button>
        </form>
    </div>

    <p id="resetMessage" class="message"></p>

    <p class="form-bottom">
        Remember your password? <a href="login.html">Login</a>
    </p>
    <p class="form-bottom"><a href="index.html">← Back to Home</a></p>
</div>

<script src="script.js"></script>
</body>
</html>
